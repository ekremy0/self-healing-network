<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber Savunma Otonom İyileştirme Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 80%; max-width: 600px; }
        h1 { margin-bottom: 20px; font-size: 24px; color: #94a3b8; }
        .status-box { padding: 30px; border-radius: 12px; font-size: 28px; font-weight: bold; margin: 20px 0; transition: all 0.3s ease; }
        .HEALTHY { background-color: #16a34a; color: white; box-shadow: 0 0 20px #16a34a; }
        .CRITICAL { background-color: #dc2626; color: white; box-shadow: 0 0 20px #dc2626; }
        .HEALING { background-color: #2563eb; color: white; box-shadow: 0 0 20px #2563eb; }
        button { background-color: #ef4444; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: transform 0.1s, background-color 0.2s; }
        button:hover { background-color: #b91c1c; transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        .log-box { margin-top: 20px; font-size: 14px; color: #cbd5e1; background: #0f172a; padding: 15px; border-radius: 8px; min-height: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ SİBER SAVUNMA OTONOM İYİLEŞTİRME PANELİ</h1>
        <div id="statusBox" class="status-box HEALTHY">SİSTEM KONTROL EDİLİYOR...</div>
        <p id="logText" class="log-box">Canlı durum izleniyor...</p>
        <button onclick="triggerAttack()">⚡ SİBER SALDIRI BAŞLAT</button>
    </div>

    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const box = document.getElementById('statusBox');
                const log = document.getElementById('logText');

                if (data.status === 'UP') {
                    box.className = 'status-box HEALTHY';
                    box.innerText = '✅ SİSTEM SAĞLIKLI (200 OK)';
                    log.innerText = 'Servis normal çalışıyor. Tehdit yok.';
                } else if (data.status === 'HEALING') {
                    box.className = 'status-box HEALING';
                    box.innerText = '🔄 OTONOM İYİLEŞTİRME ÇALIŞIYOR...';
                    log.innerText = 'Saldırı algılandı! Healer ajanı konteyneri yeniden başlatıyor...';
                } else {
                    box.className = 'status-box CRITICAL';
                    box.innerText = '🚨 SİSTEM ÇÖKTÜ / SALDIRI YEDİ!';
                    log.innerText = 'Kritik hata tespit edildi! Kurtarma bekleniyor...';
                }
            } catch (e) {
                const box = document.getElementById('statusBox');
                box.className = 'status-box CRITICAL';
                box.innerText = '❌ BAĞLANTI KOPTU!';
            }
        }

        async function triggerAttack() {
            document.getElementById('logText').innerText = 'Saldırı komutu gönderiliyor...';
            await fetch('/api/attack', { method: 'POST' });
        }

        setInterval(checkStatus, 500);
        checkStatus();
    </script>
</body>
</html>
